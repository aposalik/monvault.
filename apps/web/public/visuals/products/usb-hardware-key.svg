<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none" role="img" aria-labelledby="hk-title">
  <title id="hk-title">VaultKey USB-C Security Token — monvault. Demo Product</title>
  <rect width="640" height="480" fill="#F0EDFA"/>
  <rect x="32" y="32" width="576" height="416" rx="24" fill="#FBFAFF" stroke="#DED9EE" stroke-width="2"/>
  <text x="56" y="70" fill="#554B78" font-family="monospace" font-size="12" font-weight="700" letter-spacing="1.2">SKU // MV-SEC-03</text>
  <rect x="468" y="50" width="116" height="28" rx="14" fill="#E8E0FF" stroke="#C7B4FF"/>
  <text x="486" y="68" fill="#4C22D4" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1">0.25 TEST MON</text>

  <!-- USB-C connector tongue -->
  <rect x="136" y="214" width="68" height="52" rx="10" fill="#E8E0FF" stroke="#100B2B" stroke-width="4"/>
  <line x1="156" y1="230" x2="186" y2="230" stroke="#4C22D4" stroke-width="3" stroke-linecap="round"/>
  <line x1="156" y1="250" x2="186" y2="250" stroke="#4C22D4" stroke-width="3" stroke-linecap="round"/>

  <!-- Hardened key body shadow -->
  <rect x="210" y="186" width="286" height="128" rx="22" fill="#120A32"/>
  <!-- Hardened key body -->
  <rect x="198" y="176" width="286" height="128" rx="22" fill="#100B2B" stroke="#100B2B" stroke-width="4"/>

  <!-- Touch capacitive ring -->
  <circle cx="312" cy="240" r="36" fill="#241B52" stroke="#6738F2" stroke-width="5"/>
  <circle cx="312" cy="240" r="14" fill="#C7B4FF"/>

  <!-- Keyring loop cutout -->
  <circle cx="442" cy="240" r="18" fill="#FBFAFF" stroke="#C7B4FF" stroke-width="3"/>

  <text x="224" y="358" fill="#554B78" font-family="monospace" font-size="12" font-weight="700" letter-spacing="1">FIDO2 / HARDWARE SIGNER</text>
</svg>
